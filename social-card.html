<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Word-World Social Card</title>
  <style>
    @font-face {
      font-family: "WW Display";
      src: url("assets/fonts/Rajdhani-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "WW Japanese";
      src: url("assets/fonts/ZenKakuGothicNew-Black.ttf") format("truetype");
      font-weight: 900;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #071c25;
      color: #fff;
      font-family: "WW Japanese", -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }
    body::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(90deg, rgba(7,28,37,.98) 0%, rgba(7,28,37,.86) 42%, rgba(7,28,37,.18) 72%, rgba(7,28,37,.06) 100%);
    }
    .copy {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 730px;
      padding: 48px 58px 48px 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 54px;
      color: #ffbd47;
      font: 700 20px/1 "WW Display", sans-serif;
      font-weight: 900;
    }
    .brand img {
      width: 62px;
      height: 62px;
      border: 2px solid rgba(255,255,255,.72);
      border-radius: 8px;
    }
    h1 {
      margin: 0;
      font: 700 94px/.82 "WW Display", sans-serif;
    }
    h2 {
      margin: 38px 0 0;
      font-size: 49px;
      line-height: 1.26;
      font-weight: 900;
    }
    .meta {
      position: absolute;
      left: 64px;
      bottom: 48px;
      color: rgba(255,255,255,.76);
      font-size: 17px;
      font-weight: 500;
    }
    .gameplay {
      position: absolute;
      inset: 0 auto 0 0;
      width: 1400px;
      height: 630px;
      object-fit: cover;
      object-position: 72% 14%;
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="assets/AppIcon-1024.png" alt=""><span>ENGLISH QUIZ RPG</span></div>
    <h1>WORD-WORLD</h1>
    <h2>放課後、<br>ことばが武器になる。</h2>
    <div class="meta">答えた5問が、次の物語になる。</div>
  </div>
  <img class="gameplay" src="assets/01-home.png" alt="">
</body>
</html>
